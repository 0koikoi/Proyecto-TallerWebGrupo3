<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/08e9618c09.js"
      crossorigin="anonymous"
    ></script>
    <title>Papelería - TIENDA</title>
    <link rel="stylesheet" href="CSS/estilo.css" />
    <link rel="stylesheet" href="CSS/global.css" />
    <link rel="stylesheet" href="CSS/header.css" />
    <link rel="stylesheet" href="CSS/footer.css" />
  </head>

  <body>
    <!--header-->
    <div id="header"></div>

    <main class="main-content">
      <div class="container">
        <h1 class="heading-1">Nuestra Papelería</h1>

        <div class="productos-grid">
          <div class="producto-card">
            <img src="img/cinamoroll.jpg" alt="Cuaderno Sanrio" />
            <div class="card-content">
              <h3>Cuaderno cinamoroll</h3>
              <div class="price-box">
                <span class="new-price">S/ 7.00</span>
              </div>
              <button class="btn-comprar">Comprar</button>
            </div>
          </div>

          <div class="producto-card">
            <img src="img/cartuchera pompompurin.jpg" alt="Cartuchera" />
            <div class="card-content">
              <h3>Cartuchera Pompompurin</h3>
              <div class="price-box">
                <span class="new-price">S/ 15.00</span>
              </div>
              <button class="btn-comprar">Comprar</button>
            </div>
          </div>

          <div class="producto-card">
            <img src="img/Pompompurin pencil.jpg" alt="Lapiceros" />
            <div class="card-content">
              <h3>Lapiceros Sanrio (Pack x6)</h3>
              <div class="price-box">
                <span class="new-price">S/ 5.00</span>
              </div>
              <button class="btn-comprar">Comprar</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!--footer-->
    <div id="footer"></div>
    
    <!-- SCRIPTS -->
    <script src="js/cargaComponentes.js"></script>
    <script src="js/menu.js"></script>

    <script>
      cargaComponentes("header", "componentes/header.html");
      cargaComponentes("footer", "componentes/footer.html");
    </script>
  </body>
</html>
