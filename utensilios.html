<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/08e9618c09.js"
      crossorigin="anonymous"
    ></script>
    <title>Tazas - TIENDA</title>
    <link rel="stylesheet" href="CSS/global.css" />
    <link rel="stylesheet" href="CSS/header.css" />
    <link rel="stylesheet" href="CSS/footer.css" />
  </head>

  <body>
    <!--header-->
    <div id="header"></div>
    <script>
      cargaComponentes("header", "componentes/header.html");
    </script>

    <main class="main-content">
      <div class="container">
        <h1 class="heading-1">Nuestros utensilios</h1>

        <div class="productos-grid">
          <div class="producto-card">
            <img src="img/Sans y Papyrus saleros.jpg" alt="Saleros" />
            <div class="card-content">
              <h3>Salero Sans y Papyrus</h3>
              <div class="price-box">
                <span class="new-price">S/ 5.00</span>
              </div>
              <button class="btn-comprar">Comprar</button>
            </div>
          </div>

          <div class="producto-card">
            <img src="img/Taza gorro de Lufy.jpg" alt="Taza one piece" />
            <div class="card-content">
              <h3>Tazas One piece</h3>
              <div class="price-box">
                <span class="new-price">S/ 8.00</span>
              </div>
              <button class="btn-comprar">Comprar</button>
            </div>
          </div>

          <div class="producto-card">
            <img src="img/Lampara Minecraft.jpg" alt="Lampara" />
            <div class="card-content">
              <h3>antorcha Minecraft</h3>
              <div class="price-box">
                <span class="new-price">S/ 10.00</span>
              </div>
              <button class="btn-comprar">Comprar</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!--footer-->
    <div id="footer"></div>
    <script>
      cargaComponentes("footer", "componentes/footer.html");
    </script>

    <!--scripts-->
    <script src="js/cargaComponentes.js"></script>
  </body>
</html>
