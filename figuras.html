<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/08e9618c09.js"
      crossorigin="anonymous"
    ></script>
    <title>Figuras - TIENDA</title>
    <link rel="stylesheet" href="CSS/estilo.css" />
    <link rel="stylesheet" href="CSS/global.css" />
    <link rel="stylesheet" href="CSS/header.css" />
    <link rel="stylesheet" href="CSS/footer.css" />
  </head>

  <body>
    <div id="header"></div>

    <main class="main-content">
      <div class="container">
        <h1 class="heading-1">Nuestras figuras</h1>
        
        <div class="container-products">

          <div class="card-product">
            <div class="container-img">
              <img src="img/nendroids Suguru geto.jpg" alt="geto" />
              <div class="button-group">
                <span><i class="fa-regular fa-eye"></i></span>
                <span><i class="fa-regular fa-heart"></i></span>
                <span><i class="fa-solid fa-code-compare"></i></span>
              </div>
            </div>

            <div class="content-card-product">
              <div class="stars">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-regular fa-star"></i>
              </div>
              <h3>Nendoroid Suguru Geto</h3>
              <span class="add-cart"><i class="fa-solid fa-basket-shopping"></i></span>
              <p class="price">S/45.00</p>
            </div>
          </div>        

          <div class="card-product">
            <div class="container-img">
              <img src="img/Tenna figura.png" alt="Tenna" />
              <div class="button-group">
                <span><i class="fa-regular fa-eye"></i></span>
                <span><i class="fa-regular fa-heart"></i></span>
                <span><i class="fa-solid fa-code-compare"></i></span>
              </div>
            </div>

            <div class="content-card-product">
              <div class="stars">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-regular fa-star"></i>
              </div>
              <h3>Figura de Tenna</h3>
              <span class="add-cart"><i class="fa-solid fa-basket-shopping"></i></span>
              <p class="price">S/50.00</p>
            </div>
          </div>        

          <div class="card-product">
            <div class="container-img">
              <img src="img/Blind box alien stage.jpg" alt="Alienstage" />
              <div class="button-group">
                <span><i class="fa-regular fa-eye"></i></span>
                <span><i class="fa-regular fa-heart"></i></span>
                <span><i class="fa-solid fa-code-compare"></i></span>
              </div>
            </div>

            <div class="content-card-product">
              <div class="stars">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-regular fa-star"></i>
              </div>
              <h3>Blind box Alien stage</h3>
              <span class="add-cart"><i class="fa-solid fa-basket-shopping"></i></span>
              <p class="price">S/45.00</p>
            </div> 
          </div> </div> </div> </main>

    <div id="footer"></div>

    <script src="js/cargaComponentes.js"></script>
    <script src="js/menu.js"></script>

    <script>
      cargaComponentes("header", "componentes/header.html");
      cargaComponentes("footer", "componentes/footer.html");
    </script>
  </body>
</html>
