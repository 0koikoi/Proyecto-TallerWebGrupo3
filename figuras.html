<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/08e9618c09.js"
      crossorigin="anonymous"
    ></script>
    <title>Peluches - TIENDA</title>
    <link rel="stylesheet" href="CSS/estilo.css" />
    <link rel="stylesheet" href="CSS/global.css" />
    <link rel="stylesheet" href="CSS/header.css" />
    <link rel="stylesheet" href="CSS/footer.css" />
  </head>

  <body>
    <!--header-->
    <div id="header"></div>

    <main class="main-content">
      <div class="container">
        <h1 class="heading-1">Nuestras figuras</h1>

        <div class="productos-grid">
          <div class="producto-card">
            <img src="img/nendroids Suguru geto.jpg" alt="geto" />
            <div class="card-content">
              <h3>nedroids Suguru Geto</h3>
              <div class="price-box">
                <span class="new-price">S/ 45.00</span>
              </div>
              <button class="btn-comprar">Comprar</button>
            </div>
          </div>

          <div class="producto-card">
            <img src="img/Tenna figura.png" alt="Tenna" />
            <div class="card-content">
              <h3>Tenna Figura</h3>
              <div class="price-box">
                <span class="new-price">S/ 50.00</span>
              </div>
              <button class="btn-comprar">Comprar</button>
            </div>
          </div>

          <div class="producto-card">
            <img src="img/Blind box alien stage.jpg" alt="Alien stage" />
            <div class="card-content">
              <h3>Blind box Alien stage</h3>
              <div class="price-box">
                <span class="new-price">S/ 10.00</span>
              </div>
              <button class="btn-comprar">Comprar</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!--footer-->
    <div id="footer"></div>

    <!-- SCRIPTS -->
    <script src="js/cargaComponentes.js"></script>
    <script src="js/menu.js"></script>

    <script>
      cargaComponentes("header", "componentes/header.html");
      cargaComponentes("footer", "componentes/footer.html");
    </script>
  </body>
</html>
